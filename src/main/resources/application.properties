# =========================================================
# APPLICATION
# =========================================================
spring.application.name=DATN_NHOM3_BACKEND

# =========================================================
# SERVER
# =========================================================
server.port=8081

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# =========================================================
# SQL SERVER DATABASE
# =========================================================
spring.datasource.url=jdbc:sqlserver://MSI:1433;databaseName=duantotnghiep01;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================
# CONNECTION POOL - HIKARI CP
# =========================================================
spring.datasource.hikari.pool-name=DATN-HikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# JPA / HIBERNATE
# =========================================================

# Database được tạo bằng file SQL nên không cho Hibernate tự sửa bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================================
# JACKSON JSON
# =========================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Không báo lỗi nếu JSON gửi lên có field dư
spring.jackson.deserialization.fail-on-unknown-properties=false

# =========================================================
# GOOGLE OAUTH
# =========================================================
google.client-id=132583341812-jae6b284l1j3gvkgelkjps8vdgsv08s7.apps.googleusercontent.com

# =========================================================
# JWT CONFIGURATION
# =========================================================

# Secret phải dài tối thiểu 32 ký tự đối với HS256
jwt.secret=DATN_NHOM3_SECRET_KEY_2026_SPRING_BOOT_JWT_SECURITY_123456789

# Access Token: 24 giờ
jwt.expiration=86400000

# Refresh Token: 7 ngày
jwt.refresh-expiration=604800000

# Tên header chứa JWT
jwt.header=Authorization

# Tiền tố token
jwt.prefix=Bearer

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true

# Dung lượng tối đa của một file
spring.servlet.multipart.max-file-size=20MB

# Tổng dung lượng tối đa của một request
spring.servlet.multipart.max-request-size=25MB

# Thư mục lưu file
file.upload-dir=uploads

# Thư mục lưu ảnh đại diện học viên (public của frontend)
file.avatar-dir=D:/DATN_NHOM3/DATN_NHOM3_FRONEND/public/avatars

# Đường dẫn API truy cập file
file.access-url=/api/files

# Các loại file cho phép
file.allowed-extensions=jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx

# Dung lượng tối đa tính theo byte: 20MB
file.max-size=20971520

# =========================================================
# CORS CONFIGURATION
# =========================================================

# Frontend Vue Vite
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With

cors.exposed-headers=Authorization,Content-Disposition

cors.allow-credentials=true

cors.max-age=3600

# =========================================================
# SWAGGER / OPENAPI
# =========================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# PAGINATION
# =========================================================
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
app.pagination.default-sort=id
app.pagination.default-direction=desc

# =========================================================
# EXPORT EXCEL / PDF
# =========================================================
export.excel.file-name=bao-cao-du-an-tot-nghiep
export.pdf.file-name=bao-cao-du-an-tot-nghiep

export.company-name=TRUNG TÂM ĐÀO TẠO LÁI XE
export.company-address=TP. Hồ Chí Minh
export.company-phone=0900000000
export.company-email=admin@gmail.com

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.example.datn_nhom3_backend=DEBUG

# Ghi log ra file
logging.file.name=logs/datn-nhom3-backend.log

# Dung lượng tối đa mỗi file log
logging.logback.rollingpolicy.max-file-size=10MB

# Giữ tối đa 30 ngày
logging.logback.rollingpolicy.max-history=30

# Tổng dung lượng log tối đa
logging.logback.rollingpolicy.total-size-cap=1GB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =========================================================
# ERROR HANDLING
# =========================================================

# Không trả stack trace ra ngoài API
server.error.include-stacktrace=never

# Không trả exception chi tiết ra ngoài
server.error.include-exception=false

# Cho phép trả message lỗi đã xử lý
server.error.include-message=always

# Cho phép trả lỗi validation
server.error.include-binding-errors=always

# =========================================================
# SPRING MVC
# =========================================================
spring.mvc.throw-exception-if-no-handler-found=false

spring.web.resources.add-mappings=true

# =========================================================
# DATE TIME FORMAT
# =========================================================
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm:ss

