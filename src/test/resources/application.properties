# =========================================================
# TEST CONFIGURATION - H2 IN-MEMORY DATABASE
# =========================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true

# JPA / HIBERNATE
# DataInitializer should not run during test
# Database được tạo bằng file SQL nên không cho Hibernate tự sửa bảng
spring.jpa.hibernate.ddl-auto=update

# Không chạy data.sql (viết bằng T-SQL SQL Server) trên H2 test
spring.sql.init.mode=never

# Không chạy DataInitializer (seed) khi test
app.seed.enabled=false
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Google OAuth test
google.client-id=test-client-id.apps.googleusercontent.com

# JWT - dùng cho test
jwt.secret=TEST_SECRET_KEY_FOR_UNIT_TESTS_ONLY_1234567890123456789012
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer

# File Upload test
file.upload-dir=test-uploads
file.avatar-dir=test-uploads/avatars
file.access-url=/api/files

# Mail test config (dummy sender để JavaMailSender được khởi tạo trong test)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false

# Logging
logging.level.org.example.datn_nhom3_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG