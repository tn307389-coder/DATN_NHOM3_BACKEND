# =========================================================
# TEST CONFIGURATION - H2 IN-MEMORY DATABASE
# =========================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true

# JPA / HIBERNATE
# DataInitializer should not run during test
# Database được tạo bằng file SQL nên không cho Hibernate tự sửa bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT - dùng cho test
jwt.secret=TEST_SECRET_KEY_FOR_UNIT_TESTS_ONLY_1234567890123456789012
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer

# File Upload test
file.upload-dir=test-uploads
file.avatar-dir=test-uploads/avatars
file.access-url=/api/files

# Logging
logging.level.org.example.datn_nhom3_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG